<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>FILEHUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;display:grid;place-items:center;overflow:hidden;
  color:#fff;background:#08080c;
}
body:before,body:after{
  content:"";position:fixed;width:320px;height:320px;border-radius:50%;
  filter:blur(90px);opacity:.18;pointer-events:none;
  animation:float 9s ease-in-out infinite alternate;
}
body:before{background:#7c3aed;top:-120px;left:-100px}
body:after{background:#06b6d4;right:-120px;bottom:-120px;animation-delay:-3s}
.card{
  width:min(92vw,430px);padding:42px 26px 30px;text-align:center;
  border:1px solid rgba(255,255,255,.1);border-radius:28px;
  background:rgba(18,18,24,.72);backdrop-filter:blur(22px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  animation:rise .7s cubic-bezier(.2,.8,.2,1);
}
.logo{
  width:74px;height:74px;margin:0 auto 20px;border-radius:22px;
  display:grid;place-items:center;font-size:29px;font-weight:900;
  background:linear-gradient(135deg,#fff,#a5b4fc);color:#101016;
  box-shadow:0 12px 35px rgba(255,255,255,.12);
}
h1{margin:0;font-size:32px;letter-spacing:-1.5px}
p{margin:10px 0 28px;color:#a7a7b4;font-size:15px}
button{
  width:100%;border:0;border-radius:17px;padding:17px 20px;
  font-size:16px;font-weight:800;letter-spacing:.2px;color:#08080c;
  background:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s;
}
button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,255,255,.16)}
button:active{transform:scale(.98)}
button:disabled{opacity:.65;cursor:default;transform:none}
.note{margin-top:18px;font-size:12px;color:#666673}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{to{transform:translate(45px,35px) scale(1.12)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="logo">F</div>
  <h1>FILEHUB</h1>
  <p>Your file is ready. Generate your secure access link.</p>
  <button id="generate">GENERATE LINK</button>
  <div class="note">Secure • Fast • Simple</div>
</main>
<script>
const button=document.getElementById("generate");
const params=new URLSearchParams(location.search);
const code=params.get("code");
button.addEventListener("click",()=>{
  if(!code){button.textContent="INVALID LINK";button.disabled=true;return;}
  button.disabled=true;
  button.textContent="GENERATING…";
  const bot="https://t.me/Free_books_study_material_bot";
  const direct=bot+"?start="+encodeURIComponent(code);
  // Replace this placeholder with the VPLINK URL generated by the bot.
  // The production bot will send users here with a VPLINK target for this code.
  window.location.href=direct;
});
</script>
</body>
</html>
